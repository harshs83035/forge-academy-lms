# Reverse proxy for the LMS. Rate limits here are a second line of defence; the app also limits key/segment requests per user.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=stream:10m rate=20r/s;

upstream lms { server app:3000; keepalive 16; }

server {
  listen 80;
  # For production: redirect to https and add a `listen 443 ssl;` server using ./nginx/certs
  client_max_body_size 2g;               # admin video uploads
  server_tokens off;

  location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://lms; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; }
  location /api/stream/      { limit_req zone=stream burst=60 nodelay; proxy_pass http://lms; proxy_buffering off; add_header Cache-Control "no-store" always; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; }
  location /                 { proxy_pass http://lms; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; }
}
