# docker compose up --build            -> app on http://localhost:3000
# docker compose --profile proxy up    -> adds nginx on :80 (put your TLS certs in ./nginx/certs for :443)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      POSTGRES_DB: lms
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://lms:${POSTGRES_PASSWORD:-lms}@db:5432/lms
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (32+ random characters)}
      BRAND_NAME: ${BRAND_NAME:-Forge Academy}
      MEDIA_ROOT: /app/storage/hls
      SEED_DEMO: ${SEED_DEMO:-true}      # set false in production
      COOKIE_SECURE: ${COOKIE_SECURE:-false} # true when served over HTTPS
    volumes:
      - ./storage:/app/storage            # encrypted HLS media + uploads (swap for NAS / object-store mount)
    ports: ["3001:3000"]

  nginx:
    profiles: [proxy]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports: ["80:80", "443:443"]

volumes:
  pgdata:
